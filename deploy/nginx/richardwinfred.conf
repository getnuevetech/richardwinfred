# Static site for Richard Winfred Esi, LLC.
# lightsail-setup.sh replaces __SERVER_NAMES__ and installs this file.
# Certbot --nginx adds the HTTPS server and the HTTP redirect afterward.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;
    server_tokens off;
    charset utf-8;

    root /var/www/richardwinfred;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    include /etc/nginx/snippets/richardwinfred-headers.conf;
    # Locations that set their own add_header do not inherit this. Asset
    # responses set a longer cache below. "always" covers 404 responses.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /index.html {
        include /etc/nginx/snippets/richardwinfred-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /404.html {
        include /etc/nginx/snippets/richardwinfred-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/richardwinfred-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }
}
